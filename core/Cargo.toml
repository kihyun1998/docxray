[package]
name = "docxray"
description = "Surgical DOCX editing: project a Word document into an editable text view, edit it, and patch the changes back, leaving untouched content byte-identical."
keywords = ["docx", "ooxml", "word", "office"]
categories = ["parser-implementations", "text-processing"]
readme = "../README.md"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
authors.workspace = true

[lib]
name = "docxray"
path = "src/lib.rs"

[dependencies]
quick-xml = "0.41.0"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
thiserror = "2.0"
zip = { version = "8.6.0", default-features = false, features = ["deflate"] }
